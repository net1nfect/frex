services:
  frex-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: frex-app
    container_name: frex-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/frex/:/root/.local/share/frex/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "frex", "serve", "--host", "0.0.0.0", "--no-access-log"]
  frex-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: frex-app
    container_name: frex-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/frex/dispatch.yaml
    depends_on:
      frex-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "frex", "dispatch", "--config", "dispatch.yaml"]
